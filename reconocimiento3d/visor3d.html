<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reconocimiento3D - Laptop</title>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #101827;
        color: white;
      }

      #panel {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 10;
        background: rgba(15, 23, 42, 0.92);
        padding: 18px;
        border-radius: 12px;
        max-width: 300px;
      }

      h2 {
        margin-top: 0;
      }

      button {
        padding: 10px 14px;
        margin: 5px 4px 0 0;
        border: 0;
        border-radius: 7px;
        cursor: pointer;
        background: #2563eb;
        color: white;
      }

      #estado {
        color: #93c5fd;
        font-size: 14px;
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
        }
      }
    </script>
  </head>

  <body>
    <div id="panel">
      <h2>Reconocimiento3D</h2>
      <p>Laptop: modelo 3D</p>
      <p>Arrastra el ratón para girar y usa la rueda para acercar.</p>
      <button id="centrar">Centrar modelo</button>
      <p id="estado">Cargando modelo...</p>
    </div>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

      const escena = new THREE.Scene();
      escena.background = new THREE.Color(0x101827);

      const camara = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        1000,
      );
      camara.position.set(3, 2, 4);

      const renderizador = new THREE.WebGLRenderer({ antialias: true });
      renderizador.setSize(window.innerWidth, window.innerHeight);
      renderizador.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderizador.outputColorSpace = THREE.SRGBColorSpace;
      document.body.appendChild(renderizador.domElement);

      const controles = new OrbitControls(camara, renderizador.domElement);
      controles.enableDamping = true;

      escena.add(new THREE.HemisphereLight(0xffffff, 0x444455, 2));

      const luz = new THREE.DirectionalLight(0xffffff, 2);
      luz.position.set(5, 8, 5);
      escena.add(luz);

      const rejilla = new THREE.GridHelper(10, 10, 0x475569, 0x263449);
      escena.add(rejilla);

      let laptop;

      const parametros = new URLSearchParams(window.location.search);
      const modeloSolicitado = parametros.get("modelo") || "computador";

      const modelos = {
        computador: "./assets/Modelos/computador/laptop.glb",
        telefono: "./assets/Modelos/telefono/smartphone.glb",
      };

      const rutaModelo = modelos[modeloSolicitado] || modelos.computador;

      const cargador = new GLTFLoader();

      cargador.load(
        rutaModelo,
        (gltf) => {
          laptop = gltf.scene;
          escena.add(laptop);

          const caja = new THREE.Box3().setFromObject(laptop);
          const centro = caja.getCenter(new THREE.Vector3());
          const tamano = caja.getSize(new THREE.Vector3());
          const mayor = Math.max(tamano.x, tamano.y, tamano.z);

          laptop.position.sub(centro);

          const distancia = Math.max(mayor * 1.8, 2);
          camara.position.set(distancia, distancia * 0.65, distancia);
          controles.target.set(0, 0, 0);
          controles.update();

          document.getElementById("estado").textContent =
            "Modelo cargado correctamente";
        },
        undefined,
        (error) => {
          console.error(error);
          document.getElementById("estado").textContent =
            "No se pudo cargar. Comprueba la ruta del archivo.";
        },
      );

      document.getElementById("centrar").addEventListener("click", () => {
        if (!laptop) return;

        const caja = new THREE.Box3().setFromObject(laptop);
        const tamano = caja.getSize(new THREE.Vector3());
        const mayor = Math.max(tamano.x, tamano.y, tamano.z);
        const distancia = Math.max(mayor * 1.8, 2);

        camara.position.set(distancia, distancia * 0.65, distancia);
        controles.target.set(0, 0, 0);
        controles.update();
      });

      window.addEventListener("resize", () => {
        camara.aspect = window.innerWidth / window.innerHeight;
        camara.updateProjectionMatrix();
        renderizador.setSize(window.innerWidth, window.innerHeight);
      });

      function animar() {
        requestAnimationFrame(animar);
        controles.update();
        renderizador.render(escena, camara);
      }

      animar();
    </script>
  </body>
</html>
